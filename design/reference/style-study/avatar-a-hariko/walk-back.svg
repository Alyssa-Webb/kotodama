<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <pattern id="washi" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M3 5q3-1 6 0M15 4q2 1 4 0M7 13q3 1 5 0M18 15q2-1 4 0M4 21q3 1 5 0M14 20q3-1 5 0" stroke="#e3dac8" stroke-width="0.7" fill="none" stroke-linecap="round" />
      <path d="M9 8q2-1 4 0M2 17q2 1 4 0M19 10q2 1 3 0" stroke="#fbf8f1" stroke-width="0.7" fill="none" stroke-linecap="round" />
    </pattern>

    <g id="shadow">
      <ellipse cx="0" cy="0" rx="23" ry="5.5" fill="#d8cebc" opacity="0.75" />
      <ellipse cx="0" cy="0" rx="15" ry="3.4" fill="#c5b9a4" opacity="0.65" />
    </g>

    <g id="foot-planted">
      <ellipse cx="0" cy="2" rx="6.2" ry="3.2" fill="#7d4e24" />
      <ellipse cx="0" cy="1.3" rx="5.6" ry="2.7" fill="#c49353" />
      <path d="M-4.2-1.5 C-4.2-4 4.2-4 4.2-1.5 L3.8 1.2 C2 2.2-2 2.2-3.8 1.2 Z" fill="#f5efe3" stroke="#d8cebe" stroke-width="0.4" />
      <path d="M-3.8 0.5 Q0 2.2 3.8 0.5" stroke="#c93b2b" stroke-width="1.3" fill="none" stroke-linecap="round" />
    </g>

    <g id="foot-sole">
      <ellipse cx="0" cy="0" rx="6.5" ry="4.4" fill="#6b3f19" />
      <ellipse cx="0" cy="-0.2" rx="5.5" ry="3.5" fill="#cf9e59" />
      <path d="M-3.8-1.4 H3.8 M-4 0.8 H4" stroke="#8a5627" stroke-width="0.7" stroke-linecap="round" />
      <path d="M-4.2-3.2 Q0-4.8 4.2-3.2" stroke="#f5efe3" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <circle cx="0" cy="-2.8" r="1.1" fill="#c93b2b" />
    </g>

    <g id="foot-pass">
      <ellipse cx="0" cy="0" rx="5.8" ry="3.8" fill="#6b3f19" />
      <ellipse cx="0" cy="-0.2" rx="4.8" ry="2.9" fill="#c69552" />
      <path d="M-3.2-0.8 H3.2 M-3.2 0.9 H3.2" stroke="#8a5627" stroke-width="0.6" stroke-linecap="round" />
      <path d="M-3.5-2.6 Q0-3.8 3.5-2.6" stroke="#c93b2b" stroke-width="1.2" fill="none" />
    </g>

    <g id="arm-l-back">
      <circle cx="55" cy="126" r="4.6" fill="#f4ede0" stroke="#dfd4c2" stroke-width="0.5" />
      <path d="M77 105 C67 107 57 115 55 123 C54 128 58 137 66 137 C72 137 76 130 78 122 Z" fill="#5b8ec3" />
      <path d="M56 126 C57 133 62 137 67 136 C69 135 70 131 68 128 Z" fill="#c93b2b" />
      <path d="M57 125 C59 132 64 136 69 135" stroke="#eab928" stroke-width="0.7" fill="none" />
      <g transform="translate(66,121)">
        <circle cx="0" cy="-2" r="1.1" fill="#fbf7ef" /><circle cx="1.9" cy="-0.6" r="1.1" fill="#fbf7ef" />
        <circle cx="1.2" cy="1.6" r="1.1" fill="#fbf7ef" /><circle cx="-1.2" cy="1.6" r="1.1" fill="#fbf7ef" />
        <circle cx="-1.9" cy="-0.6" r="1.1" fill="#fbf7ef" /><circle cx="0" cy="0" r="0.8" fill="#eab928" />
      </g>
    </g>

    <g id="arm-l-fwd">
      <circle cx="53" cy="117" r="4.8" fill="#f4ede0" stroke="#dfd4c2" stroke-width="0.5" />
      <path d="M77 104 C66 104 56 110 54 117 C53 122 59 129 66 128 C72 127 76 121 78 115 Z" fill="#5485b9" />
      <path d="M56 120 C58 125 63 128 67 127" stroke="#c93b2b" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <circle cx="65" cy="116" r="1.8" fill="#fbf7ef" /><circle cx="65" cy="116" r="0.7" fill="#eab928" />
    </g>

    <g id="arm-r-back">
      <circle cx="145" cy="126" r="4.6" fill="#f4ede0" stroke="#dfd4c2" stroke-width="0.5" />
      <path d="M123 105 C133 107 143 115 145 123 C146 128 142 137 134 137 C128 137 124 130 122 122 Z" fill="#5b8ec3" />
      <path d="M144 126 C143 133 138 137 133 136 C131 135 130 131 132 128 Z" fill="#c93b2b" />
      <path d="M143 125 C141 132 136 136 131 135" stroke="#eab928" stroke-width="0.7" fill="none" />
      <g transform="translate(134,121)">
        <path d="M0-2.8 L2.4 0 L0 2.8 L-2.4 0 Z" fill="#c93b2b" />
        <circle cx="0" cy="0" r="0.9" fill="#eab928" />
      </g>
    </g>

    <g id="arm-r-fwd">
      <circle cx="147" cy="117" r="4.8" fill="#f4ede0" stroke="#dfd4c2" stroke-width="0.5" />
      <path d="M123 104 C134 104 144 110 146 117 C147 122 141 129 134 128 C128 127 124 121 122 115 Z" fill="#5485b9" />
      <path d="M144 120 C142 125 137 128 133 127" stroke="#c93b2b" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <path d="M135 113.5 L137 116 L135 118.5 L133 116 Z" fill="#c93b2b" /><circle cx="135" cy="116" r="0.7" fill="#eab928" />
    </g>

    <g id="torso">
      <path d="M83 101 Q100 107 117 101 L120 105 Q100 112 80 105 Z" fill="#f7f2e8" stroke="#dfd5c3" stroke-width="0.5" />
      <path d="M76 104 Q100 109 124 104 L126 144 Q100 149 74 144 Z" fill="#6295c9" />
      <path d="M76 104 Q88 107 100 107 L100 146 Q86 146 74 144 Z" fill="#5b8ec3" />
      <path d="M82 111 Q90 109 96 112 M105 114 Q112 112 118 115 M79 135 Q89 137 96 135" stroke="#7aa8d6" stroke-width="0.9" fill="none" stroke-linecap="round" />
      <line x1="100" y1="107" x2="100" y2="146" stroke="#4777ab" stroke-width="0.8" />
      <path d="M74.5 137 Q100 142 125.5 137 L126 144 Q100 149 74 144 Z" fill="#4676ab" />
      <path d="M75.5 144 Q100 148.5 124.5 144 L123.5 148.5 Q100 152.5 76.5 148.5 Z" fill="#c89632" stroke="#9e7019" stroke-width="0.5" />
      <g transform="translate(100,114)">
        <path d="M0-3.8 L3.5 0 L0 3.8 L-3.5 0 Z" fill="#eab928" stroke="#b88414" stroke-width="0.4" />
        <circle cx="0" cy="0" r="1.6" fill="#fbf7ef" />
      </g>
      <g transform="translate(83,139)">
        <circle cx="0" cy="-2.1" r="1.2" fill="#fbf7ef" /><circle cx="2" cy="-0.6" r="1.2" fill="#fbf7ef" />
        <circle cx="1.2" cy="1.7" r="1.2" fill="#fbf7ef" /><circle cx="-1.2" cy="1.7" r="1.2" fill="#fbf7ef" />
        <circle cx="-2" cy="-0.6" r="1.2" fill="#fbf7ef" /><circle cx="0" cy="0" r="0.9" fill="#eab928" />
      </g>
      <g transform="translate(117,139)">
        <path d="M0-3 L2.6 0 L0 3 L-2.6 0 Z" fill="#c93b2b" />
        <circle cx="0" cy="0" r="1" fill="#eab928" />
        <circle cx="0" cy="-3.6" r="0.6" fill="#fbf7ef" /><circle cx="0" cy="3.6" r="0.6" fill="#fbf7ef" />
      </g>
      <path d="M74.5 121.5 Q100 125 125.5 121.5 L125.8 128.5 Q100 132 74.2 128.5 Z" fill="#e8b624" stroke="#c28e14" stroke-width="0.5" />
      <path d="M74.2 128 Q100 131.5 125.8 128 L125.5 132.5 Q100 136 74.5 132.5 Z" fill="#f7f2e8" stroke="#dcd2c0" stroke-width="0.5" />
    </g>

    <g id="obi-knot">
      <path d="M99 127 L96 135 L98.5 135.5 L100 128 Z" fill="#d9a41a" stroke="#ad7b10" stroke-width="0.4" />
      <path d="M101 127 L104 135 L101.5 135.5 L100 128 Z" fill="#e8b624" stroke="#ad7b10" stroke-width="0.4" />
      <path d="M91 124 C91 121.5 96 122 100 124.5 C104 122 109 121.5 109 124 C109 127 104 128 100 126.5 C96 128 91 127 91 124 Z" fill="#ecc032" stroke="#b58212" stroke-width="0.5" />
      <circle cx="100" cy="125" r="2.1" fill="#c93b2b" stroke="#9e2417" stroke-width="0.4" />
      <circle cx="99.5" cy="124.5" r="0.6" fill="#eab928" />
    </g>

    <g id="head">
      <ellipse cx="60" cy="86" rx="4.2" ry="5.2" fill="#efe5d4" stroke="#d5c7b2" stroke-width="0.5" />
      <ellipse cx="140" cy="86" rx="4.2" ry="5.2" fill="#efe5d4" stroke="#d5c7b2" stroke-width="0.5" />
      <path d="M64 98 C63 103 64 107 67 107 C69 107 70 104 69 100 Z" fill="#181715" />
      <path d="M136 98 C137 103 136 107 133 107 C131 107 130 104 131 100 Z" fill="#181715" />
      <path d="M139 72 C143 72 146 74 145 76 C144 78 141 77 138 76 Z" fill="#211f1d" />
      <path d="M100 46 C73 46 59 61 59 82 C59 92 61 99 65 101 C75 104 125 104 135 101 C139 99 141 92 141 82 C141 61 127 46 100 46 Z" fill="#211f1d" />
      <path d="M62 94 C74 101 126 101 138 94 C137 98 135 100 133 101 C122 104 78 104 67 101 C65 100 63 98 62 94 Z" fill="#151412" />
      <path d="M72 56 Q100 50 128 56" stroke="#524d45" stroke-width="0.9" fill="none" stroke-linecap="round" />
      <path d="M75 62h5m8-2h6m9 0h6m8 2h5 M68 70h5m8-1h6m9-1h5m9 1h5m8 1h5 M65 78h5m7-1h6m8 0h6m9 0h5m8 1h5 M67 86h5m8 0h5m9 0h6m8 0h5m7 0h5 M72 93h5m9 1h5m9 0h6m8-1h5" stroke="#686156" stroke-width="0.8" fill="none" stroke-linecap="round" />
      <path d="M79 66h4m12-1h5m11 1h4 M71 74h4m13 0h5m12 0h5m11 0h4 M74 82h4m12 0h5m12 0h4m11 0h4 M78 90h4m12 0h5m11 0h4" stroke="#423e38" stroke-width="0.8" fill="none" stroke-linecap="round" />
      <circle cx="81" cy="55" r="0.9" fill="#dca82e" />
    </g>

    <g id="topknot">
      <ellipse cx="95" cy="41" rx="4.5" ry="3.8" fill="#1e1c1a" />
      <ellipse cx="105" cy="41.5" rx="4.5" ry="3.6" fill="#1e1c1a" />
      <ellipse cx="100" cy="39" rx="5.2" ry="4.2" fill="#252320" />
      <path d="M96 38 Q100 36 104 38" stroke="#575148" stroke-width="0.7" fill="none" stroke-linecap="round" />
      <path d="M93 45.5 Q100 47 107 45.5" stroke="#c93b2b" stroke-width="1.6" fill="none" stroke-linecap="round" />
      <path d="M95 45.5 Q100 46.6 105 45.5" stroke="#eab928" stroke-width="0.9" fill="none" stroke-linecap="round" />
    </g>
  </defs>

  <style>
    svg { background: #e8dfd0; }
    .f { opacity: 0; animation: walk 0.667s steps(1, end) infinite; }
    .f1 { animation-delay: 0s; }
    .f2 { animation-delay: -0.0833s; }
    .f3 { animation-delay: -0.1667s; }
    .f4 { animation-delay: -0.2500s; }
    .f5 { animation-delay: -0.3333s; }
    .f6 { animation-delay: -0.4167s; }
    .f7 { animation-delay: -0.5000s; }
    .f8 { animation-delay: -0.5833s; }
    @keyframes walk {
      0%, 12.49% { opacity: 1; }
      12.5%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .f { animation: none; opacity: 0; }
      .f1 { opacity: 1; }
    }
  </style>

  <!-- Stage & Washi Paper Background -->
  <rect x="7" y="7" width="186" height="186" rx="6" fill="#f4eee1" />
  <path d="M79 142 Q100 140 121 142 L138 174 Q100 177 62 174 Z" fill="#eae2d2" />
  <ellipse cx="76" cy="166" rx="2.6" ry="1.1" fill="#dcd1be" />
  <ellipse cx="123" cy="156" rx="2.1" ry="0.9" fill="#dcd1be" />
  <rect x="7" y="7" width="186" height="186" rx="6" fill="url(#washi)" />

  <!-- Frame 1: Left Contact (left foot forward, right sole visible behind hem, right arm forward, left arm back) -->
  <g class="f f1">
    <use href="#shadow" transform="translate(100,155) scale(1,1)" />
    <use href="#foot-planted" transform="translate(89,148) scale(0.92)" />
    <g transform="translate(0,0)">
      <use href="#arm-r-fwd" transform="translate(0,-1)" />
      <use href="#torso" transform="translate(-0.8,0) rotate(-1,100,125)" />
      <use href="#foot-sole" transform="translate(111,153) rotate(-4)" />
      <use href="#arm-l-back" transform="translate(0,1)" />
      <use href="#obi-knot" transform="translate(-1,-2)" />
      <use href="#head" transform="translate(0,0) rotate(-0.8,100,85)" />
      <use href="#topknot" transform="translate(-0.5,-2.2)" />
    </g>
  </g>

  <!-- Frame 2: Left Down (body lowest +4, knees bent, left arm max back, right arm max forward, lag catching up) -->
  <g class="f f2">
    <use href="#shadow" transform="translate(100,155) scale(1.08,1.06)" />
    <use href="#foot-planted" transform="translate(89,151) scale(0.96)" />
    <g transform="translate(0,4)">
      <use href="#arm-r-fwd" transform="translate(1,-2) rotate(-3,130,110)" />
      <use href="#torso" transform="translate(-1.2,0) rotate(-1.6,100,125)" />
      <use href="#foot-sole" transform="translate(111,150) rotate(-8)" />
      <use href="#arm-l-back" transform="translate(-1,2) rotate(3,70,110)" />
      <use href="#obi-knot" transform="translate(-1.5,-1.5)" />
      <use href="#head" transform="translate(0,0) rotate(-1.2,100,85)" />
      <use href="#topknot" transform="translate(-0.8,-1.8)" />
    </g>
  </g>

  <!-- Frame 3: Left Passing (feet passing, right foot lifted, body rising -1.5, topknot/obi knot at lowest dip) -->
  <g class="f f3">
    <use href="#shadow" transform="translate(100,155) scale(0.94,0.94)" />
    <use href="#foot-planted" transform="translate(91,151)" />
    <g transform="translate(0,-1.5)">
      <use href="#arm-r-fwd" transform="translate(-1,1)" />
      <use href="#torso" transform="translate(-0.4,0) rotate(-0.5,100,125)" />
      <use href="#foot-pass" transform="translate(108,147) rotate(6)" />
      <use href="#arm-l-back" transform="translate(1,-1)" />
      <use href="#obi-knot" transform="translate(-0.5,2.2)" />
      <use href="#head" transform="translate(0,0)" />
      <use href="#topknot" transform="translate(0,2.2)" />
    </g>
  </g>

  <!-- Frame 4: Left Up (body highest -4, left back foot lifting heel, right foot reaching forward, shadow shrinks) -->
  <g class="f f4">
    <use href="#shadow" transform="translate(100,155) scale(0.84,0.84)" />
    <use href="#foot-planted" transform="translate(110,145) scale(0.88)" />
    <g transform="translate(0,-4)">
      <use href="#arm-l-fwd" transform="translate(-1,1)" />
      <use href="#torso" transform="translate(0.4,0) rotate(0.6,100,125)" />
      <use href="#foot-sole" transform="translate(90,153) scale(0.94) rotate(5)" />
      <use href="#arm-r-back" transform="translate(-1,-1)" />
      <use href="#obi-knot" transform="translate(0.5,1.2)" />
      <use href="#head" transform="translate(0,0) rotate(0.5,100,85)" />
      <use href="#topknot" transform="translate(0.4,1.2)" />
    </g>
  </g>

  <!-- Frame 5: Right Contact (right foot forward, left sole visible behind hem, left arm forward, right arm back) -->
  <g class="f f5">
    <use href="#shadow" transform="translate(100,155) scale(1,1)" />
    <use href="#foot-planted" transform="translate(111,148) scale(0.92)" />
    <g transform="translate(0,0)">
      <use href="#arm-l-fwd" transform="translate(0,-1)" />
      <use href="#torso" transform="translate(0.8,0) rotate(1,100,125)" />
      <use href="#foot-sole" transform="translate(89,153) rotate(4)" />
      <use href="#arm-r-back" transform="translate(0,1)" />
      <use href="#obi-knot" transform="translate(1,-2)" />
      <use href="#head" transform="translate(0,0) rotate(0.8,100,85)" />
      <use href="#topknot" transform="translate(0.5,-2.2)" />
    </g>
  </g>

  <!-- Frame 6: Right Down (body lowest +4, knees bent, right arm max back, left arm max forward, lag catching up) -->
  <g class="f f6">
    <use href="#shadow" transform="translate(100,155) scale(1.08,1.06)" />
    <use href="#foot-planted" transform="translate(111,151) scale(0.96)" />
    <g transform="translate(0,4)">
      <use href="#arm-l-fwd" transform="translate(-1,-2) rotate(3,70,110)" />
      <use href="#torso" transform="translate(1.2,0) rotate(1.6,100,125)" />
      <use href="#foot-sole" transform="translate(89,150) rotate(8)" />
      <use href="#arm-r-back" transform="translate(1,2) rotate(-3,130,110)" />
      <use href="#obi-knot" transform="translate(1.5,-1.5)" />
      <use href="#head" transform="translate(0,0) rotate(1.2,100,85)" />
      <use href="#topknot" transform="translate(0.8,-1.8)" />
    </g>
  </g>

  <!-- Frame 7: Right Passing (feet passing, left foot lifted, body rising -1.5, topknot/obi knot at lowest dip) -->
  <g class="f f7">
    <use href="#shadow" transform="translate(100,155) scale(0.94,0.94)" />
    <use href="#foot-planted" transform="translate(109,151)" />
    <g transform="translate(0,-1.5)">
      <use href="#arm-l-fwd" transform="translate(1,1)" />
      <use href="#torso" transform="translate(0.4,0) rotate(0.5,100,125)" />
      <use href="#foot-pass" transform="translate(92,147) rotate(-6)" />
      <use href="#arm-r-back" transform="translate(-1,-1)" />
      <use href="#obi-knot" transform="translate(0.5,2.2)" />
      <use href="#head" transform="translate(0,0)" />
      <use href="#topknot" transform="translate(0,2.2)" />
    </g>
  </g>

  <!-- Frame 8: Right Up (body highest -4, right back foot lifting heel, left foot reaching forward, shadow shrinks) -->
  <g class="f f8">
    <use href="#shadow" transform="translate(100,155) scale(0.84,0.84)" />
    <use href="#foot-planted" transform="translate(90,145) scale(0.88)" />
    <g transform="translate(0,-4)">
      <use href="#arm-r-fwd" transform="translate(1,1)" />
      <use href="#torso" transform="translate(-0.4,0) rotate(-0.6,100,125)" />
      <use href="#foot-sole" transform="translate(110,153) scale(0.94) rotate(-5)" />
      <use href="#arm-l-back" transform="translate(1,-1)" />
      <use href="#obi-knot" transform="translate(-0.5,1.2)" />
      <use href="#head" transform="translate(0,0) rotate(-0.5,100,85)" />
      <use href="#topknot" transform="translate(-0.4,1.2)" />
    </g>
  </g>
</svg>
