<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <style>
    .f { opacity: 0; animation: show 0.6667s steps(1, end) infinite; }
    .f1 { animation-delay: 0s; }
    .f2 { animation-delay: -0.5833s; }
    .f3 { animation-delay: -0.5s; }
    .f4 { animation-delay: -0.4167s; }
    .f5 { animation-delay: -0.3333s; }
    .f6 { animation-delay: -0.25s; }
    .f7 { animation-delay: -0.1667s; }
    .f8 { animation-delay: -0.0833s; }
    @keyframes show {
      0% { opacity: 1; }
      12.5% { opacity: 0; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .f { animation: none; opacity: 0; }
      .f1 { opacity: 1; }
    }
  </style>

  <defs>
    <!-- 3/4 straw sandal foot (facing right) -->
    <g id="ft-3q">
      <path d="M-9,-13 L8,-13 L11,0 C5,4 -6,4 -10,0 Z" fill="#f5ebe0"/>
      <ellipse cx="2" cy="2" rx="15" ry="5" fill="#c9ae7a"/>
      <path d="M-2,-2 C3,-6 9,-5 12,0" stroke="#dfbe5c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M-1,-2 C3,-5 8,-4 11,0" stroke="#23201d" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <path d="M-14,2 C-12,8 17,8 18,2 C17,9 -13,9 -14,2 Z" fill="#1f1d1a"/>
    </g>

    <!-- Wooden bokken (origin 0,0 at two-hand grip on tsuka, blade along +X) -->
    <g id="bokken">
      <!-- Tsuka handle & curved oak blade -->
      <path d="M-24,-3.5 L12,-3.5 C46,-4 82,-6.5 110,-9.5 L115,-4.5 C86,0 48,2.5 12,3.2 L-24,3.2 Z" fill="#d7b98e"/>
      <path d="M12,0 C48,-0.5 84,-2.5 113,-5.5 L115,-4.5 C86,0 48,2.5 12,3.2 Z" fill="#a88455" fill-opacity="0.65"/>
      <!-- Calligraphic sumi outline & wood grain -->
      <path d="M-25,-4.2 L12,-4.2 C46,-4.8 82,-7.2 110,-10.5 L117,-4.2 C86,0.8 48,3.4 12,4 L-25,4 Z M-22,1.8 L12,1.8 C47,1.2 84,-1.2 112,-5 L109,-8 C81,-5 45,-2.5 12,-2 L-22,-2 Z" fill="#1f1d1a" fill-rule="evenodd"/>
      <!-- Wooden/leather tsuba handguard -->
      <rect x="9" y="-9.5" width="5" height="19" rx="2" fill="#8c683e" stroke="#1f1d1a" stroke-width="2"/>
    </g>

    <!-- 3/4 kimono torso: pale blue wash, white crossed collar, yellow sash -->
    <g id="torso-3q">
      <path d="M-8,-49 L10,-49 L12,-36 L-10,-36 Z" fill="#ead6c3"/>
      <path d="M-24,-42 L22,-42 L34,-6 L32,42 C12,46 -14,46 -33,42 L-35,-6 Z" fill="#b8d4e8"/>
      <path d="M-33,16 C-12,21 12,21 32,16 L32,42 C12,46 -14,46 -33,42 Z" fill="#8fb5d1" fill-opacity="0.52"/>
      <!-- White crossed collar on 3/4 chest + overlap line -->
      <path d="M-6,-43 L3,-43 L16,-16 L9,-13 Z" fill="#fbfaf6"/>
      <path d="M21,-42 L13,-43 L-2,-9 L6,-9 Z" fill="#fbfaf6"/>
      <path d="M13,-43 L-3,-9 L0,-9 L15,-42 Z" fill="#1f1d1a"/>
      <path d="M-2,13 L4,13 L5,43 L-1,43 Z" fill="#fbfaf6"/>
      <!-- Ochre under-hem & sumi skirt brushwork -->
      <path d="M-30,41 C-10,45 10,45 29,41 L28,49 C10,53 -10,53 -29,49 Z" fill="#cba963"/>
      <path d="M-25,-42 C-31,-28 -35,-12 -36,10 L-34,43 C-13,48 13,48 33,43 L35,10 C34,-12 29,-28 23,-42 L20,-38 C25,-25 30,-10 30,10 L29,40 C11,44 -11,44 -30,40 L-31,10 C-31,-10 -27,-25 -22,-38 Z" fill="#1f1d1a"/>
      <path d="M-30,48 C-10,53 10,53 29,48 C12,56 -12,56 -30,48 Z" fill="#1f1d1a"/>
      <!-- White obiita & yellow sash -->
      <path d="M-36,3 C-12,7 14,7 35,3 L36,13 C14,17 -12,17 -37,13 Z" fill="#fbfaf6"/>
      <path d="M-35,-9 C-12,-6 14,-6 34,-9 L35,5 C14,9 -12,9 -36,5 Z" fill="#ecd04f"/>
      <path d="M-36,-9 C-12,-5 14,-5 35,-9 C14,-2 -12,-2 -36,-9 Z" fill="#1f1d1a"/>
      <path d="M-37,13 C-12,18 14,18 37,13 C14,20 -12,20 -37,13 Z" fill="#1f1d1a"/>
    </g>

    <!-- Sash knot overlap states (placed on front-right waist) -->
    <g id="sk-3q-mid">
      <path d="M-4,1 C-8,7 -9,13 -4,14 C-1,15 1,10 1,3 C2,10 5,15 9,14 C12,13 10,6 5,1 Z" fill="#cfa926"/>
      <ellipse cx="1" cy="-1" rx="6.5" ry="4" fill="#ecd04f"/>
      <path d="M-6,-1 C-3,-6 5,-6 8,-1 C5,-4 -3,-4 -6,-1 Z" fill="#1f1d1a"/>
      <path d="M-1,3 L-6,13 M3,3 L8,13" stroke="#1f1d1a" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="sk-3q-back">
      <path d="M-2,0 C-10,3 -16,8 -12,12 C-9,14 -3,9 1,3 C-3,9 -4,15 0,15 C5,15 7,8 4,1 Z" fill="#cfa926"/>
      <ellipse cx="1" cy="-1" rx="6.5" ry="4" fill="#ecd04f"/>
      <path d="M-6,-1 C-3,-6 5,-6 8,-1 C5,-4 -3,-4 -6,-1 Z" fill="#1f1d1a"/>
      <path d="M-1,3 L-12,10 M2,3 L-1,14" stroke="#1f1d1a" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="sk-3q-fwd">
      <path d="M-2,1 C2,7 7,13 12,12 C15,11 11,6 4,2 C9,6 15,9 17,6 C19,3 12,-1 5,0 Z" fill="#cfa926"/>
      <ellipse cx="1" cy="-1" rx="6.5" ry="4" fill="#ecd04f"/>
      <path d="M-6,-1 C-3,-6 5,-6 8,-1 C5,-4 -3,-4 -6,-1 Z" fill="#1f1d1a"/>
      <path d="M2,3 L12,11 M4,1 L16,5" stroke="#1f1d1a" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- 3/4 Chibi head facing right (matches kimono-front-left.png) -->
    <g id="head-3q">
      <!-- Back bob mass + cute stray tuft + far cheek lock -->
      <path d="M-8,-54 C-48,-54 -68,-26 -67,12 C-66,30 -58,43 -44,48 L42,46 C53,40 57,24 56,4 C55,-28 32,-54 -8,-54 Z" fill="#181715"/>
      <path d="M-64,-9 C-75,-13 -80,-6 -74,0 C-70,4 -64,2 -62,0 Z" fill="#181715"/>
      <path d="M44,-6 C46,18 44,38 35,49 C44,50 53,42 56,28 C58,14 57,-2 53,-12 Z" fill="#181715"/>
      <!-- 3/4 Face with warm shade & calligraphic cheek contour -->
      <path d="M-26,-16 L49,-16 C53,4 53,24 46,36 C38,47 20,50 -2,50 C-18,50 -26,40 -26,20 Z" fill="#f5ebe0"/>
      <path d="M-24,24 C-6,42 34,41 48,22 C44,40 26,50 -2,50 C-18,50 -25,40 -24,24 Z" fill="#e6d3c1"/>
      <path d="M49,-6 C54,12 52,30 43,40 C34,49 16,52 -4,50 C15,48 32,45 40,37 C48,28 50,12 46,-5 Z" fill="#1f1d1a"/>
      <!-- Pink cheeks -->
      <ellipse cx="-5" cy="24" rx="11.5" ry="7.5" fill="#e89f99" fill-opacity="0.58"/>
      <ellipse cx="42" cy="22" rx="7" ry="6.5" fill="#e89f99" fill-opacity="0.55"/>
      <!-- Near ear & near cheek side-lock -->
      <ellipse cx="-38" cy="15" rx="10.5" ry="14" fill="#f5ebe0"/>
      <ellipse cx="-37" cy="16" rx="6" ry="8" fill="#e4ceba"/>
      <path d="M-33,2 C-46,0 -51,12 -46,23 C-42,30 -34,30 -30,26 C-37,26 -42,21 -43,14 C-44,7 -39,3 -32,5 Z" fill="#1f1d1a"/>
      <path d="M-34,-10 C-35,15 -32,38 -20,51 C-14,52 -12,45 -15,36 C-18,22 -18,6 -16,-12 Z" fill="#181715"/>
      <!-- 3-part short fringe & sumi hair highlight -->
      <path d="M-24,-28 C-23,-8 -14,-4 4,-8 L9,-19 L12,-7 C22,-4 33,-5 41,-8 L43,-18 L47,-8 C55,-6 58,-12 54,-28 C38,-48 -10,-48 -24,-28 Z" fill="#181715"/>
      <path d="M-44,-29 C-22,-43 18,-43 38,-30 C16,-36 -22,-36 -44,-29 Z" fill="#5e5952" fill-opacity="0.65"/>
    </g>

    <!-- Expressions: calm guard vs focused strike -->
    <g id="face-calm">
      <path d="M-6,-5 C0,-9 8,-8 12,-5" stroke="#181715" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M30,-6 C35,-9 42,-8 45,-5" stroke="#181715" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <ellipse cx="4" cy="11" rx="9.8" ry="11.2" fill="#181715"/>
      <path d="M-5,4 L-10,0 L-4,2 Z" fill="#181715"/>
      <circle cx="1" cy="7" r="2.8" fill="#f7f4ec"/>
      <ellipse cx="37" cy="11" rx="7.5" ry="10.8" fill="#181715"/>
      <circle cx="35" cy="7" r="2.4" fill="#f7f4ec"/>
      <path d="M16,27 C20,32 26,32 30,27 C31,29 27,34 23,34 C19,34 15,29 16,27 Z" fill="#1f1d1a"/>
    </g>
    <g id="face-focus">
      <path d="M-6,-7 L12,-3" stroke="#181715" stroke-width="3" stroke-linecap="round"/>
      <path d="M45,-7 L31,-3" stroke="#181715" stroke-width="2.8" stroke-linecap="round"/>
      <ellipse cx="5" cy="11" rx="9.8" ry="10.5" fill="#181715"/>
      <circle cx="3" cy="7" r="2.8" fill="#f7f4ec"/>
      <ellipse cx="38" cy="11" rx="7.5" ry="10" fill="#181715"/>
      <circle cx="36" cy="7" r="2.4" fill="#f7f4ec"/>
      <path d="M18,29 C22,26 27,26 30,29" stroke="#1f1d1a" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Topknot overlap states: neutral, whipped back, whipped forward -->
    <g id="tk-3q-mid">
      <path d="M-8,-2 C-17,-10 -19,-19 -11,-21 C-6,-22 -2,-16 0,-10 C3,-19 11,-22 16,-17 C20,-12 14,-5 6,-2 Z" fill="#181715"/>
      <path d="M-7,-2 C-2,-5 4,-5 8,-2 C6,2 -5,2 -7,-2 Z" fill="#d9c398"/>
    </g>
    <g id="tk-3q-back">
      <path d="M-6,-2 C-18,-5 -28,-12 -24,-18 C-20,-22 -11,-17 -4,-11 C-9,-19 -4,-25 3,-22 C10,-19 9,-9 5,-2 Z" fill="#181715"/>
      <path d="M-7,-2 C-2,-5 4,-5 8,-2 C6,2 -5,2 -7,-2 Z" fill="#d9c398"/>
    </g>
    <g id="tk-3q-fwd">
      <path d="M-5,-2 C0,-12 8,-21 16,-20 C21,-19 18,-12 11,-7 C18,-13 26,-12 26,-6 C26,0 15,0 6,-2 Z" fill="#181715"/>
      <path d="M-7,-2 C-2,-5 4,-5 8,-2 C6,2 -5,2 -7,-2 Z" fill="#d9c398"/>
    </g>

    <!-- Reusable wide sleeve + two chibi hands gripping at (0,0) -->
    <g id="hands-grip">
      <circle cx="7" cy="-3" r="8.5" fill="#ead6c3" stroke="#1f1d1a" stroke-width="2.2"/>
      <circle cx="-5" cy="2" r="9" fill="#f5ebe0" stroke="#1f1d1a" stroke-width="2.4"/>
    </g>
  </defs>

  <!-- Plain warm white washi paper -->
  <rect width="400" height="400" fill="#f7f4ec"/>

  <!-- Expressive dry-brush sumi ground sweep -->
  <path d="M118,331 C172,324 244,324 298,331 C248,339 168,339 118,331 Z" fill="#9c9589" fill-opacity="0.34"/>

  <!-- Frame 1: Anticipation 1 — leaning back, raising wooden bokken -->
  <g class="f f1">
    <use href="#ft-3q" x="164" y="325"/>
    <use href="#ft-3q" x="210" y="324"/>
    <g transform="translate(184,256) rotate(-6)">
      <use href="#torso-3q"/>
      <use href="#sk-3q-fwd" x="15" y="2"/>
    </g>
    <g transform="translate(178,156) rotate(-7)">
      <use href="#head-3q"/>
      <use href="#face-calm"/>
      <use href="#tk-3q-fwd" x="-8" y="-53"/>
    </g>
    <path d="M174,218 C184,196 196,162 204,136 L220,152 C216,182 202,212 186,226 Z" fill="#b8d4e8" stroke="#1f1d1a" stroke-width="3.2" stroke-linejoin="round"/>
    <use href="#bokken" transform="translate(204,130) rotate(-108)"/>
    <use href="#hands-grip" x="204" y="130"/>
  </g>

  <!-- Frame 2: Anticipation 2 — deep coil back, bokken cocked high overhead -->
  <g class="f f2">
    <use href="#ft-3q" x="156" y="326"/>
    <use href="#ft-3q" x="206" y="321"/>
    <g transform="translate(174,259) rotate(-13) scale(0.97,1.04)">
      <use href="#torso-3q"/>
      <use href="#sk-3q-fwd" x="15" y="2"/>
    </g>
    <g transform="translate(164,158) rotate(-14)">
      <use href="#head-3q"/>
      <use href="#face-focus"/>
      <use href="#tk-3q-fwd" x="-8" y="-53"/>
    </g>
    <path d="M162,220 C168,192 176,152 182,120 L200,136 C198,170 188,208 174,226 Z" fill="#b8d4e8" stroke="#1f1d1a" stroke-width="3.2" stroke-linejoin="round"/>
    <use href="#bokken" transform="translate(182,114) rotate(-138)"/>
    <use href="#hands-grip" x="182" y="114"/>
  </g>

  <!-- Frame 3: The Swing (Smear 1) — explosive lunge & overhead sumi-ink blade arc blur -->
  <g class="f f3">
    <!-- Sumi-e dry-brush & oak smear crescent from overhead (-135 deg) to horizontal (-10 deg) -->
    <path d="M112,42 C188,6 312,48 360,162 L250,184 C236,126 184,92 146,104 Z" fill="#c9c2b6" fill-opacity="0.45"/>
    <path d="M126,36 C206,6 322,52 362,164 C308,74 206,36 138,58 Z" fill="#d7b98e" fill-opacity="0.65"/>
    <path d="M108,45 C192,2 320,46 364,164 C326,64 198,20 120,56 Z" fill="#181715"/>
    <path d="M162,46 C234,28 316,74 348,166 C308,90 232,50 168,58 Z" fill="#5e5952" fill-opacity="0.6"/>
    <use href="#ft-3q" x="162" y="325"/>
    <use href="#ft-3q" x="228" y="324"/>
    <g transform="translate(204,255) rotate(9) scale(1.05,0.96)">
      <use href="#torso-3q"/>
      <use href="#sk-3q-back" x="15" y="2"/>
    </g>
    <g transform="translate(210,155) rotate(8)">
      <use href="#head-3q"/>
      <use href="#face-focus"/>
      <use href="#tk-3q-back" x="-8" y="-53"/>
    </g>
    <path d="M196,216 C214,206 234,196 248,184 L238,214 C220,224 202,228 190,226 Z" fill="#b8d4e8" stroke="#1f1d1a" stroke-width="3.2" stroke-linejoin="round"/>
    <use href="#bokken" transform="translate(248,184) rotate(-12)"/>
    <use href="#hands-grip" x="248" y="184"/>
  </g>

  <!-- Frame 4: The Swing (Smear 2) — fast downward slash blur driving into impact -->
  <g class="f f4">
    <!-- Sumi-e slash smear arc from upper-right (-22 deg) down to strike zone (+18 deg) -->
    <path d="M348,122 C382,166 384,218 364,258 L256,224 C272,196 270,170 250,156 Z" fill="#c9c2b6" fill-opacity="0.48"/>
    <path d="M352,130 C380,170 382,218 364,258 C372,216 368,172 340,140 Z" fill="#d7b98e" fill-opacity="0.7"/>
    <path d="M344,116 C386,162 388,218 365,260 C376,214 372,166 334,128 Z" fill="#181715"/>
    <path d="M326,144 C354,178 358,216 346,248 C348,214 342,180 318,152 Z" fill="#5e5952" fill-opacity="0.55"/>
    <use href="#ft-3q" x="164" y="325"/>
    <use href="#ft-3q" x="238" y="326"/>
    <g transform="translate(214,260) rotate(13) scale(1.04,0.95)">
      <use href="#torso-3q"/>
      <use href="#sk-3q-back" x="15" y="2"/>
    </g>
    <g transform="translate(222,161) rotate(11)">
      <use href="#head-3q"/>
      <use href="#face-focus"/>
      <use href="#tk-3q-back" x="-8" y="-53"/>
    </g>
    <path d="M204,222 C224,220 242,220 256,224 L240,250 C222,252 206,244 198,234 Z" fill="#b8d4e8" stroke="#1f1d1a" stroke-width="3.2" stroke-linejoin="round"/>
    <use href="#bokken" transform="translate(256,224) rotate(18)"/>
    <use href="#hands-grip" x="256" y="224"/>
  </g>

  <!-- Frame 5: Impact — weighty hit-stop squash, crisp bokken & sumi shock sparks, forward whip -->
  <g class="f f5">
    <use href="#ft-3q" x="164" y="325"/>
    <use href="#ft-3q" x="242" y="326"/>
    <g transform="translate(216,265) rotate(11) scale(1.07,0.92)">
      <use href="#torso-3q"/>
      <use href="#sk-3q-fwd" x="15" y="2"/>
    </g>
    <g transform="translate(224,168) rotate(10) scale(1.03,0.97)">
      <use href="#head-3q"/>
      <use href="#face-focus"/>
      <use href="#tk-3q-fwd" x="-8" y="-53"/>
    </g>
    <path d="M206,228 C226,226 244,228 256,232 L244,260 C226,264 210,252 200,240 Z" fill="#b8d4e8" stroke="#1f1d1a" stroke-width="3.2" stroke-linejoin="round"/>
    <use href="#bokken" transform="translate(256,232) rotate(16)"/>
    <use href="#hands-grip" x="256" y="232"/>
    <!-- Sumi ink impact burst sparks at blade tip -->
    <path d="M368,252 L386,242 L372,257 Z M369,261 L387,267 L367,266 Z M360,246 L369,231 L365,248 Z M358,266 L365,281 L354,268 Z" fill="#181715"/>
  </g>

  <!-- Frame 6: Follow-through — heavy wooden blade dips lower, sleeves & knots overshoot forward -->
  <g class="f f6">
    <use href="#ft-3q" x="164" y="325"/>
    <use href="#ft-3q" x="240" y="326"/>
    <g transform="translate(214,263) rotate(9) scale(1.04,0.95)">
      <use href="#torso-3q"/>
      <use href="#sk-3q-fwd" x="15" y="2"/>
    </g>
    <g transform="translate(220,165) rotate(8)">
      <use href="#head-3q"/>
      <use href="#face-focus"/>
      <use href="#tk-3q-fwd" x="-8" y="-53"/>
    </g>
    <path d="M204,226 C224,228 240,232 252,238 L236,266 C218,268 204,254 198,238 Z" fill="#b8d4e8" stroke="#1f1d1a" stroke-width="3.2" stroke-linejoin="round"/>
    <use href="#bokken" transform="translate(252,238) rotate(27)"/>
    <use href="#hands-grip" x="252" y="238"/>
  </g>

  <!-- Frame 7: Recovery — stepping & rising back from lunge, lifting bokken toward guard -->
  <g class="f f7">
    <use href="#ft-3q" x="164" y="325"/>
    <use href="#ft-3q" x="224" y="325"/>
    <g transform="translate(198,258) rotate(3)">
      <use href="#torso-3q"/>
      <use href="#sk-3q-mid" x="15" y="2"/>
    </g>
    <g transform="translate(200,158) rotate(3)">
      <use href="#head-3q"/>
      <use href="#face-calm"/>
      <use href="#tk-3q-mid" x="-8" y="-53"/>
    </g>
    <path d="M188,220 C206,218 222,218 234,218 L220,246 C204,248 190,238 184,228 Z" fill="#b8d4e8" stroke="#1f1d1a" stroke-width="3.2" stroke-linejoin="round"/>
    <use href="#bokken" transform="translate(234,218) rotate(-6)"/>
    <use href="#hands-grip" x="234" y="218"/>
  </g>

  <!-- Frame 8: Guard — poised 3/4 chudan stance, ready to coil into Frame 1 -->
  <g class="f f8">
    <use href="#ft-3q" x="164" y="325"/>
    <use href="#ft-3q" x="216" y="325"/>
    <g transform="translate(190,256)">
      <use href="#torso-3q"/>
      <use href="#sk-3q-mid" x="15" y="2"/>
    </g>
    <g transform="translate(190,156)">
      <use href="#head-3q"/>
      <use href="#face-calm"/>
      <use href="#tk-3q-mid" x="-8" y="-53"/>
    </g>
    <path d="M180,218 C196,214 212,210 224,208 L212,236 C196,240 182,232 176,224 Z" fill="#b8d4e8" stroke="#1f1d1a" stroke-width="3.2" stroke-linejoin="round"/>
    <use href="#bokken" transform="translate(224,208) rotate(-24)"/>
    <use href="#hands-grip" x="224" y="208"/>
  </g>

  <!-- Vermilion hanko seal in bottom-right corner -->
  <g transform="translate(348,346)">
    <path d="M2,1 C9,0 19,0 25,2 C27,8 27,19 25,25 C18,27 8,27 2,25 C0,18 0,8 2,1 Z" fill="#c83e2b"/>
    <path d="M7,7 H19 M13,7 V20 M8,13 H18 M7,20 H19" stroke="#f7f4ec" stroke-width="1.8" stroke-linecap="square" fill="none"/>
  </g>

  <!-- Small caption naming the clip -->
  <text x="24" y="366" font-family="serif" font-size="13" fill="#5e5952" letter-spacing="0.5">strike</text>
</svg>
