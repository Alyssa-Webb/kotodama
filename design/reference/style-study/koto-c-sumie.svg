    <path d="M346 209 Q347 218 346 224 M360 209 Q360 218 359 224" fill="none" stroke="#1E1C1A" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Style caption in English -->
  <text x="256" y="482" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#3A3631" letter-spacing="0.8">Sumi-e Ink Painting</text>
</svg>
