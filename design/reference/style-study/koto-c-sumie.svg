<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Koto in sumi-e ink painting style">
  <defs>
    <!-- Luminous white gasenshi washi paper -->
    <radialGradient id="sumie-paper" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#FCFBF7" />
      <stop offset="78%" stop-color="#F7F4EC" />
      <stop offset="100%" stop-color="#EDE7DA" />
    </radialGradient>

    <!-- Delicate handmade washi fibre whisper -->
    <pattern id="sumie-fibres" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M10 18 Q18 15 25 19 M54 12 Q61 16 67 13 M22 52 Q30 48 36 53 M58 62 Q66 59 72 64" fill="none" stroke="#DFD8C8" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
      <path d="M34 26 Q42 22 48 27 M14 66 Q21 63 27 67" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.8" />
    </pattern>
  </defs>

  <!-- White washi background -->
  <rect width="512" height="512" fill="url(#sumie-paper)" />
  <rect width="512" height="512" fill="url(#sumie-fibres)" />

  <!-- Atmospheric pale grey ink mist wash (tanboku nijimi) in negative space -->
  <path d="M64 316 C118 292 184 302 248 308 C326 315 398 292 448 312 C426 336 352 346 258 342 C164 338 92 336 64 316 Z" fill="#23211E" opacity="0.045" />
  <!-- Expressive wet-to-dry ground ink sweep beneath feet -->
  <path d="M126 418 C176 407 288 408 378 416 C396 418 412 420 424 422 C398 423 364 422 332 424 C252 429 162 429 126 418 Z" fill="#23211E" opacity="0.16" />
  <path d="M148 419 C204 413 292 414 366 419 M340 423 L408 425 M368 426 L422 427" fill="none" stroke="#6E6A63" stroke-width="1.6" stroke-linecap="round" opacity="0.45" />

  <!-- Vermilion hanko artist seal stamp (lower-left balance) -->
  <g id="hanko-seal" transform="rotate(-1.5 84 390)">
    <path d="M67 373 C76 372 93 372 101 373 C103 374 103 398 101 406 C92 408 75 408 67 406 C65 397 65 375 67 373 Z" fill="#C63D26" opacity="0.92" />
    <!-- Subtle dry stamp paper voids & carved white seal-script 言 -->
    <circle cx="71" cy="402" r="1.3" fill="#FAF7F0" />
    <circle cx="98" cy="378" r="1.1" fill="#FAF7F0" />
    <rect x="70" y="376" width="28" height="28" fill="none" stroke="#FAF7F0" stroke-width="1.3" opacity="0.85" />
    <path d="M79 381 H89 M74 386 H94 M78 391 H90 M78 395 H90" stroke="#FAF7F0" stroke-width="2" stroke-linecap="round" />
    <rect x="78" y="398" width="12" height="5" fill="none" stroke="#FAF7F0" stroke-width="1.8" />
  </g>

  <!-- Floating kotodama gold-ink (kindei) enso word-orbs -->
  <g id="gold-orbs">
    <!-- Left enso gold orb -->
    <circle cx="82" cy="212" r="14" fill="#EED279" opacity="0.38" />
    <path d="M88 197 C78 194 67 201 67 212 C67 223 76 230 86 228 C95 226 100 217 97 207 C95 202 92 199 90 198 C93 203 94 212 90 219 C85 225 75 224 72 215 C69 207 76 199 88 197 Z" fill="#D5A438" />
    <path d="M77 195 C79 187 84 182 82 175" fill="none" stroke="#5A5650" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />

    <!-- Right enso gold orb -->
    <circle cx="430" cy="176" r="12.5" fill="#EED279" opacity="0.38" />
    <path d="M435 163 C426 160 417 167 417 176 C417 186 425 192 434 190 C442 188 446 180 443 171 C441 167 439 165 437 164 C440 169 440 176 437 182 C432 187 424 186 421 179 C419 172 425 165 435 163 Z" fill="#D5A438" />
    <path d="M427 160 C429 153 433 149 431 143" fill="none" stroke="#5A5650" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- Stubby chibi feet brushed in grey wash & sumi ink -->
  <g id="feet">
    <ellipse cx="210" cy="408" rx="27" ry="13" fill="#FCFBF7" />
    <path d="M185 410 C194 419 224 419 235 409 C232 418 222 422 209 422 C195 422 186 417 185 410 Z" fill="#23211E" opacity="0.16" />
    <path d="M183 409 C181 398 196 393 213 394 C224 395 234 399 236 406 C231 401 222 398 211 398 C197 398 187 402 188 410 C189 416 202 419 224 417 C206 422 185 419 183 409 Z" fill="#262421" />
    <path d="M202 411 Q203 417 201 420 M215 411 Q216 417 214 420" fill="none" stroke="#262421" stroke-width="2" stroke-linecap="round" />

    <ellipse cx="300" cy="408" rx="27" ry="13" fill="#FCFBF7" />
    <path d="M275 410 C284 419 314 419 325 409 C322 418 312 422 299 422 C285 422 276 417 275 410 Z" fill="#23211E" opacity="0.16" />
    <path d="M327 409 C329 398 314 393 297 394 C286 395 276 399 274 406 C279 401 288 398 299 398 C313 398 323 402 322 410 C321 416 308 419 286 417 C304 422 325 419 327 409 Z" fill="#262421" />
    <path d="M294 411 Q295 417 293 420 M307 411 Q308 417 306 420" fill="none" stroke="#262421" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Small chibi body: grey sumi under-collar & wet vermilion box-shaped robe -->
  <g id="sumie-robe">
    <!-- Wet grey sumi shoulder wash (replacing indigo so palette stays pure sumi + vermilion + gold) -->
    <path d="M166 304 C166 283 186 274 254 274 C322 274 342 284 342 306 L344 378 C344 396 326 405 304 405 L206 405 C182 405 165 395 166 376 Z" fill="#4E4A44" />
    <path d="M166 304 C166 283 186 274 254 274 C308 274 334 281 340 297 C326 285 300 280 254 280 C194 280 173 289 172 310 L172 384 C167 378 166 368 166 356 Z" fill="#23211E" />

    <!-- Wet vermilion brush-wash box robe -->
    <path d="M173 292 C174 282 190 278 254 278 C318 278 334 283 336 294 L338 382 C338 398 323 406 300 406 C268 407 224 407 206 405 C184 403 171 395 172 379 Z" fill="#C63D26" />
    <!-- Deeper wet vermilion ink pooling along left & lower hem -->
    <path d="M173 302 C176 344 182 382 204 394 C232 401 288 400 326 393 C318 403 304 406 284 406 L206 405 C184 403 171 395 172 379 Z" fill="#A52D19" opacity="0.72" />
