<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Koto in Edo hariko folk toy style">
  <defs>
    <!-- Warm handmade kozo washi background tone -->
    <radialGradient id="washi-bg" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#F5EDE0" />
      <stop offset="72%" stop-color="#ECE0CC" />
      <stop offset="100%" stop-color="#DFCFB4" />
    </radialGradient>

    <!-- Subtle mulberry fibre & chalky paper grain -->
    <pattern id="washi-grain" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M8 14 Q16 11 23 15 M46 9 Q53 14 59 11 M18 44 Q25 40 31 46 M52 54 Q60 50 66 55 M6 62 Q13 59 18 64" fill="none" stroke="#CBB898" stroke-width="0.9" stroke-linecap="round" opacity="0.55" />
      <path d="M29 22 Q36 18 42 23 M12 31 Q17 28 22 32 M41 37 Q48 34 53 39 M26 60 Q33 57 39 61" fill="none" stroke="#FFFDF7" stroke-width="1" stroke-linecap="round" opacity="0.65" />
      <circle cx="15" cy="20" r="0.9" fill="#C9B594" opacity="0.45" />
      <circle cx="57" cy="28" r="1.1" fill="#C9B594" opacity="0.4" />
      <circle cx="35" cy="49" r="0.8" fill="#C9B594" opacity="0.45" />
      <circle cx="63" cy="64" r="1" fill="#FFFDF7" opacity="0.55" />
