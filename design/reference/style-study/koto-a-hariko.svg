    <path d="M231 235 C231 264 277 264 277 235 Z" fill="#94281B" />
    <ellipse cx="254" cy="250" rx="14" ry="8.5" fill="#E6958D" />
    <path d="M227 234 Q241 240 254 231 Q267 240 281 234" fill="none" stroke="#231F1C" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
