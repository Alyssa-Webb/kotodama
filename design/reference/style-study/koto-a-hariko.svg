      <path d="M238 313 C248 311 264 311 272 313 C276 314 276 320 271 321 C261 322 247 322 238 320 C234 319 234 314 238 313 Z" />
      <!-- Stroke 2 (wide horizon bar) -->
      <path d="M219 328 C238 326 273 326 291 328 C295 329 295 335 290 336 C272 337 238 337 220 336 C215 335 215 329 219 328 Z" />
      <!-- Stroke 3 -->
      <path d="M232 342 C246 341 265 341 278 342 C282 343 282 349 277 350 C264 351 246 351 233 350 C229 349 229 343 232 342 Z" />
      <!-- Stroke 4 -->
      <path d="M232 355 C246 354 265 354 278 355 C282 356 282 362 277 363 C264 364 246 364 233 363 C229 362 229 356 232 355 Z" />
