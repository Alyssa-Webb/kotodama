      <path d="M364 231 C378 231 393 232 405 236 C392 235 378 235 364 235 C362 235 362 231 364 231 Z" />
      <path d="M362 242 C374 245 387 249 397 255 C386 251 374 248 361 246 C359 245 360 242 362 242 Z" />
    </g>

