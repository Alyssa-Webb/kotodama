    <path d="M254 64 C274 83 278 108 254 115 C230 108 234 83 254 64 Z" fill="#D6A539" />
    <polygon points="245,78 261,75 265,101 244,104" fill="#ECCB68" />
    <polygon points="247,80 256,78 258,94 247,96" fill="#F8E5A2" />
    <path d="M254 85 C259 93 258 103 253 108" fill="none" stroke="#9C2D1B" stroke-width="1.8" stroke-linecap="round" />

