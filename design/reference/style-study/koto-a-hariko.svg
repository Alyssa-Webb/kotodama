    <ellipse cx="160" cy="236" rx="23" ry="13.5" fill="#E69A92" opacity="0.72" />
    <ellipse cx="160" cy="236" rx="15" ry="8.5" fill="#DD827A" opacity="0.45" />
    <ellipse cx="346" cy="236" rx="23" ry="13.5" fill="#E69A92" opacity="0.72" />
    <ellipse cx="346" cy="236" rx="15" ry="8.5" fill="#DD827A" opacity="0.45" />

